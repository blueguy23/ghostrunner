name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-tests:
    name: Runner Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run registration test harness
        run: bash scripts/test-registration.sh

      - name: Validate entrypoint syntax
        run: bash -n entrypoint.sh

      - name: Validate preflight script syntax
        run: bash -n scripts/preflight-check.sh

      - name: Shellcheck all scripts
        run: |
          find . -name "*.sh" -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning
